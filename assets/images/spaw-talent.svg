<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Symphony of Praise and Worship Talent Quest artwork">
  <defs>
    <radialGradient id="t-glow" cx="66%" cy="52%" r="66%">
      <stop offset="0%" stop-color="#a91d2c" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#3a1116" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0a0908" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t-cone" x1="0.15" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#faf7f2" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#e8b877" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e8b877" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="t-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#a91d2c"/>
      <stop offset="55%" stop-color="#d63a34"/>
      <stop offset="100%" stop-color="#e8b877"/>
    </linearGradient>
    <linearGradient id="t-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0908" stop-opacity="0.96"/>
      <stop offset="46%" stop-color="#0a0908" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0a0908" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="t-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0908" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0908" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="t-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="t-soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="t-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="19"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="t-frame"><rect width="1600" height="1000"/></clipPath>
  </defs>

  <g clip-path="url(#t-frame)">
    <rect width="1600" height="1000" fill="#0a0908"/>
    <rect width="1600" height="1000" fill="url(#t-glow)"/>

    <!-- the search: concentric target rings, off-centre -->
    <g fill="none" stroke="#a9895a" opacity="0.4">
      <circle cx="1046" cy="452" r="96" stroke-width="1.2"/>
      <circle cx="1046" cy="452" r="186" stroke-width="1" opacity="0.7" stroke-dasharray="3 9"/>
      <circle cx="1046" cy="452" r="286" stroke-width="1" opacity="0.45"/>
      <circle cx="1046" cy="452" r="404" stroke-width="1" opacity="0.25" stroke-dasharray="2 14"/>
    </g>
    <g stroke="#d63a34" stroke-width="1.2" opacity="0.55">
      <path d="M1046 300 v-58 M1046 662 v58 M894 452 h-58 M1198 452 h58"/>
    </g>

    <!-- spotlight cone finding the voice -->
    <path d="M700 -80 L1360 1080 L802 1080 Z" fill="url(#t-cone)" filter="url(#t-soft2)"/>
    <circle cx="700" cy="-40" r="150" fill="#faf7f2" opacity="0.22" filter="url(#t-soft)"/>

    <!-- mic on a stand, centre of the target -->
    <g transform="translate(1046 452)">
      <g fill="none" stroke="#faf7f2" stroke-width="3.2" opacity="0.92">
        <rect x="-25" y="-118" width="50" height="104" rx="25"/>
        <path d="M-46 -46 a46 46 0 0 0 92 0"/>
        <path d="M0 0 v46"/>
        <path d="M-34 46 h68"/>
      </g>
      <g stroke="#d63a34" stroke-width="2.4" opacity="0.85">
        <path d="M-25 -96 h50 M-25 -74 h50 M-25 -52 h50"/>
      </g>
      <circle cx="0" cy="-66" r="122" fill="#e8b877" opacity="0.10" filter="url(#t-soft)"/>
    </g>

    <!-- rising equaliser: the cohort finding its level -->
    <g opacity="0.9">
      <rect x="470" y="742" width="17" height="118" fill="url(#t-bar)" opacity="0.5"/>
      <rect x="512" y="676" width="17" height="184" fill="url(#t-bar)" opacity="0.6"/>
      <rect x="554" y="778" width="17" height="82" fill="url(#t-bar)" opacity="0.45"/>
      <rect x="596" y="608" width="17" height="252" fill="url(#t-bar)" opacity="0.72"/>
      <rect x="638" y="712" width="17" height="148" fill="url(#t-bar)" opacity="0.55"/>
      <rect x="680" y="530" width="17" height="330" fill="url(#t-bar)" opacity="0.85"/>
      <rect x="722" y="656" width="17" height="204" fill="url(#t-bar)" opacity="0.62"/>
      <rect x="764" y="448" width="17" height="412" fill="url(#t-bar)"/>
      <rect x="806" y="620" width="17" height="240" fill="url(#t-bar)" opacity="0.7"/>
      <rect x="848" y="736" width="17" height="124" fill="url(#t-bar)" opacity="0.5"/>
      <rect x="1250" y="700" width="17" height="160" fill="url(#t-bar)" opacity="0.5"/>
      <rect x="1292" y="596" width="17" height="264" fill="url(#t-bar)" opacity="0.65"/>
      <rect x="1334" y="726" width="17" height="134" fill="url(#t-bar)" opacity="0.45"/>
      <rect x="1376" y="640" width="17" height="220" fill="url(#t-bar)" opacity="0.58"/>
      <rect x="1418" y="770" width="17" height="90" fill="url(#t-bar)" opacity="0.4"/>
    </g>
    <path d="M470 860 H1435" stroke="#a9895a" stroke-width="1" opacity="0.45"/>

    <!-- sparks: voices in the room -->
    <g fill="#e8b877" opacity="0.75">
      <circle cx="392" cy="266" r="2.6"/><circle cx="486" cy="398" r="1.8"/>
      <circle cx="1338" cy="228" r="2.2"/><circle cx="1466" cy="386" r="1.6"/>
      <circle cx="880" cy="182" r="2"/><circle cx="1188" cy="152" r="1.7"/>
      <circle cx="612" cy="316" r="1.5"/><circle cx="1420" cy="540" r="2.1"/>
    </g>
    <g stroke="#faf7f2" stroke-width="1" opacity="0.5">
      <path d="M392 250 v32 M376 266 h32"/>
      <path d="M1338 212 v32 M1322 228 h32"/>
    </g>

    <rect y="640" width="1600" height="360" fill="url(#t-floor)"/>
    <rect width="820" height="1000" fill="url(#t-fade)"/>

    <!-- editorial marks -->
    <g>
      <rect x="96" y="96" width="54" height="2" fill="#d63a34"/>
      <text x="96" y="146" font-family="Manrope, Segoe UI, sans-serif" font-size="21" font-weight="700" letter-spacing="7" fill="#faf7f2" opacity="0.85">S P A W</text>
      <text x="96" y="186" font-family="Manrope, Segoe UI, sans-serif" font-size="14" font-weight="600" letter-spacing="4.5" fill="#a9895a">TALENT QUEST · CLASS OF 2026</text>
    </g>
    <text x="1504" y="946" text-anchor="end" font-family="Instrument Serif, Times New Roman, serif" font-size="120" fill="#faf7f2" opacity="0.07">Vol. IV</text>

    <rect width="1600" height="1000" filter="url(#t-grain)" opacity="0.055" style="mix-blend-mode:overlay"/>
  </g>
</svg>
